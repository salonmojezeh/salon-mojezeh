<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ثبت‌نام | سالن معجزه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="signup.css">
</head>
<body>
  <div id="loader"><div class="loader-spinner"></div></div>
  <div id="overlay"></div>

  <aside id="sidebar" class="sidebar">
    <button id="closeSidebar" class="sidebar-close" aria-label="بستن">×</button>
    <div class="sidebar-brand"><strong>سالن معجزه</strong><span>استایل شما، معجزه ماست</span></div>
    <nav>
      <a href="index.html">خانه</a>
      <a href="reserve.html">رزرو نوبت</a>
      <a href="profile.html">پروفایل من</a>
      <a href="club.html">باشگاه مشتریان</a>
      <a href="gallery.html">نمونه‌کارها</a>
      <a href="news.html">اخبار و مقالات</a>
      <a href="services.html">خدمات</a>
      <a href="about.html">درباره ما</a>
      <a href="contact.html">تماس با ما</a>
      <a href="maps.html">مسیریابی</a>
    </nav>
  </aside>

  <header id="header" class="site-header">
    <button id="menuBtn" class="icon-btn" aria-label="منو">☰</button>
    <a href="profile.html" id="headerProfileBtn" class="header-profile" aria-label="پروفایل">◉</a>
    <div class="header-title"><strong>سالن معجزه</strong><small>استایل شما، معجزه ماست</small></div>
    <button id="themeToggle" class="icon-btn" aria-label="تغییر تم"><span id="themeIcon">☾</span></button>
  </header>

  <main class="signup-page">
    <section class="signup-card">
      <div class="signup-heading">
        <span class="signup-icon">✦</span>
        <h1>ساخت حساب مشتری</h1>
        <p>حساب خودت را بساز تا رزروها و اطلاعاتت همیشه در دسترس باشد.</p>
      </div>

      <div id="signupMessage" class="form-message" hidden></div>

      <form id="signupForm" novalidate>
        <div class="form-grid">
          <label>
            <span>نام</span>
            <input id="firstName" name="firstName" type="text" autocomplete="given-name" required>
          </label>
          <label>
            <span>نام خانوادگی</span>
            <input id="lastName" name="lastName" type="text" autocomplete="family-name" required>
          </label>
        </div>

        <label>
          <span>شماره موبایل</span>
          <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="مثلاً ۰۹۱۲۱۲۳۴۵۶۷" required>
          <small>شماره موبایل ایرانی خودت را وارد کن.</small>
        </label>

        <label>
          <span>ایمیل</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com">
        </label>

        <div class="form-grid">
          <label>
            <span>رمز عبور</span>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
          </label>
          <label>
            <span>تکرار رمز عبور</span>
            <input id="password2" name="password2" type="password" autocomplete="new-password" required minlength="8">
          </label>
        </div>

        <label class="terms">
          <input id="terms" type="checkbox" required>
          <span>قوانین رزرو و استفاده از حساب کاربری را می‌پذیرم.</span>
        </label>

        <button id="signupBtn" class="primary-btn" type="submit">
          <span>ثبت‌نام</span>
          <span class="btn-loader" hidden></span>
        </button>
      </form>

      <div class="signup-footer">
        <span>قبلاً حساب ساخته‌ای؟</span>
        <a href="login.html">ورود به حساب</a>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
  <script type="module" src="signup.js"></script>
</body>
</html>
