<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ثبت‌نام | سالن معجزه</title>
<link rel="stylesheet" href="signup.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">✂️ سالن معجزه</a>
  <button id="btnTheme" class="iconbtn" title="تغییر تم">🌙</button>
</header>

<main class="wrap">
  <div class="card">
    <h1>ثبت‌نام</h1>
    <p class="sub">برای رزرو آنلاین و عضویت در باشگاه مشتریان، حساب بسازید.</p>
    <form id="formSignup">
      <label>نام و نام خانوادگی
        <input id="suName" class="input" required autocomplete="name">
      </label>
      <label>شماره موبایل
        <input id="suPhone" class="input" inputmode="tel" placeholder="۰۹xxxxxxxxx" required autocomplete="tel">
      </label>
      <label>تاریخ تولد <small>(برای هدیه تولد باشگاه مشتریان)</small>
        <input id="suBirth" type="date" class="input">
      </label>
      <label>رمز عبور
        <input id="suPass" type="password" class="input" minlength="6" required autocomplete="new-password">
      </label>
      <label>تکرار رمز عبور
        <input id="suPass2" type="password" class="input" minlength="6" required autocomplete="new-password">
      </label>
      <p id="msg" class="msg hidden"></p>
      <button class="btn main" type="submit" id="btnSubmit">ایجاد حساب</button>
    </form>
    <p class="alt">حساب دارید؟ <a href="login.html">ورود</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="signup.js"></script>
</body>
</html>
