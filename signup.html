<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ثبت‌نام | سالن معجزه</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="signup.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></head><body>
<div id="loader"><div class="loader-circle"></div><h2>سالن معجزه</h2></div><div id="overlay"></div><aside id="sidebar"><div class="sidebar-header"><img src="images/logo.png" alt="سالن معجزه"><h2>سالن معجزه</h2><button id="closeSidebar" type="button"><i class="fa-solid fa-xmark"></i></button></div><nav><a href="index.html"><i class="fa-solid fa-house"></i><span>صفحه اصلی</span></a><a href="reserve.html"><i class="fa-solid fa-calendar-days"></i><span>رزرو نوبت</span></a><a href="profile.html"><i class="fa-solid fa-user"></i><span>پروفایل من</span></a><a href="login.html"><i class="fa-solid fa-right-to-bracket"></i><span>ورود</span></a></nav></aside>
<header id="header"><button id="menuBtn" type="button"><i class="fa-solid fa-bars"></i></button><a class="logo-box" href="index.html"><img src="images/logo.png" alt="Salon"><div><h2>سالن معجزه</h2><small>استایل شما، معجزه ماست</small></div></a><button id="themeToggle" type="button"><i class="fa-solid fa-moon"></i></button></header>
<main class="auth-page"><form id="signupForm" class="auth-card"><h1>ساخت حساب مشتری</h1><p>با ثبت‌نام، رزروها و اطلاعات حساب شما در پروفایل نگهداری می‌شود.</p><div class="auth-grid"><label>نام<input id="firstName" required autocomplete="given-name"></label><label>نام خانوادگی<input id="lastName" required autocomplete="family-name"></label><label>شماره موبایل<input id="phone" type="tel" inputmode="numeric" placeholder="09123456789" maxlength="11" required autocomplete="tel"></label><label>ایمیل<input id="email" type="email" required autocomplete="email"></label><label>تاریخ تولد (برای هدیه تولد)<input id="birthDate" type="date"></label><label>رمز عبور<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>تکرار رمز عبور<input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></label></div><p class="form-message" id="formMessage" aria-live="polite"></p><button class="primary-btn" id="signupSubmit" type="submit">ثبت‌نام</button><p class="auth-foot">حساب دارید؟ <a href="login.html">ورود به حساب</a></p></form></main>
<script src="script.js"></script><script type="module" src="signup.js"></script></body></html>
