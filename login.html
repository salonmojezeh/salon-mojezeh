<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ورود | سالن معجزه
    </title>


    <link
        rel="stylesheet"
        href="login.css"
    >


    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<main class="login-page">


    <section class="login-card">


        <div class="login-logo">

            <div class="logo-icon">

                <i class="fa-solid fa-scissors"></i>

            </div>


            <h1>

                سالن معجزه

            </h1>


            <p>

                ورود به حساب کاربری

            </p>


        </div>



        <form
            id="loginForm"
            class="login-form"
        >


            <!-- Email -->

            <div class="input-group">


                <label>

                    ایمیل

                </label>


                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>


                    <input
                        type="email"
                        id="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


            </div>



            <!-- Password -->

            <div class="input-group">


                <label>

                    رمز عبور

                </label>


                <div class="input-box">

                    <i class="fa-solid fa-lock"></i>


                    <input
                        type="password"
                        id="password"
                        placeholder="رمز عبور"
                        required
                    >

                </div>


            </div>



            <!-- Error -->

            <div
                id="loginMessage"
                class="login-message"
            ></div>



            <!-- Button -->

            <button
                type="submit"
                id="loginBtn"
                class="login-btn"
            >


                <i class="fa-solid fa-right-to-bracket"></i>


                ورود به حساب


            </button>


        </form>



        <div class="login-footer">


            <a href="index.html">


                <i class="fa-solid fa-arrow-right"></i>


                بازگشت به سایت


            </a>


        </div>


    </section>


</main>



<script
    type="module"
    src="login.js"
></script>


</body>

</html>
