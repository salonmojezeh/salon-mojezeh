<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ورود | سالن معجزه</title>
<link rel="stylesheet" href="login.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">✂️ سالن معجزه</a>
  <button id="btnTheme" class="iconbtn" title="تغییر تم">🌙</button>
</header>

<main class="wrap">
  <div class="card">
    <h1>ورود</h1>
    <p class="sub">با شماره موبایل و رمز عبور خود وارد شوید.</p>
    <form id="formLogin">
      <label>شماره موبایل
        <input id="liPhone" class="input" inputmode="tel" placeholder="۰۹xxxxxxxxx" required autocomplete="tel">
      </label>
      <label>رمز عبور
        <input id="liPass" type="password" class="input" required autocomplete="current-password">
      </label>
      <p id="msg" class="msg hidden"></p>
      <button class="btn main" type="submit" id="btnSubmit">ورود</button>
    </form>
    <p class="alt">حساب ندارید؟ <a href="signup.html">ثبت‌نام</a></p>
    <p class="alt"><a href="index.html">← بازگشت به صفحه اصلی</a></p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="login.js"></script>
</body>
</html>
