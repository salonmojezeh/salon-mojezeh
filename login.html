<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ورود به حساب | سالن معجزه
    </title>


    <link
        rel="stylesheet"
        href="login.css"
    >


    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>


<!-- Header -->

<header class="site-header">


    <a
        href="index.html"
        class="header-logo"
    >

        <div class="header-logo-icon">

            <i class="fa-solid fa-scissors"></i>

        </div>


        <div>

            <strong>
                سالن معجزه
            </strong>

            <span>
                Salon Mojezeh
            </span>

        </div>

    </a>



    <div class="header-actions">


        <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="تغییر حالت شب و روز"
        >

            <i
                id="themeIcon"
                class="fa-solid fa-moon"
            ></i>

        </button>


        <a
            href="index.html"
            class="back-home"
        >

            <i class="fa-solid fa-house"></i>

            <span>
                صفحه اصلی
            </span>

        </a>


    </div>


</header>



<main class="login-page">


    <section class="login-card">


        <div class="login-logo">


            <div class="logo-icon">

                <i class="fa-solid fa-user-lock"></i>

            </div>


            <h1>

                ورود به حساب کاربری

            </h1>


            <p>

                برای ورود به پروفایل خود ایمیل و رمز عبور را وارد کنید.

            </p>


        </div>



        <form
            id="loginForm"
            class="login-form"
            novalidate
        >


            <!-- Email -->

            <div class="input-group">


                <label for="email">

                    ایمیل

                </label>


                <div class="input-box">


                    <i class="fa-solid fa-envelope"></i>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >


                </div>


            </div>



            <!-- Password -->

            <div class="input-group">


                <label for="password">

                    رمز عبور

                </label>


                <div class="input-box">


                    <i class="fa-solid fa-lock"></i>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="رمز عبور"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="passwordToggle"
                        class="password-toggle"
                        aria-label="نمایش رمز عبور"
                    >

                        <i
                            id="passwordToggleIcon"
                            class="fa-solid fa-eye"
                        ></i>

                    </button>


                </div>


            </div>



            <!-- Message -->

            <div
                id="loginMessage"
                class="login-message"
                role="alert"
            ></div>



            <!-- Button -->

            <button
                type="submit"
                id="loginBtn"
                class="login-btn"
            >


                <i class="fa-solid fa-right-to-bracket"></i>


                <span>

                    ورود به حساب

                </span>


            </button>


        </form>



        <div class="login-footer">


            <p>

                هنوز حساب کاربری ندارید؟

            </p>


            <a href="index.html#reservation">

                ابتدا از طریق رزرو سالن اطلاعات خود را ثبت کنید.

            </a>


        </div>


    </section>


</main>



<script
    type="module"
    src="login.js"
></script>


</body>

</html>
