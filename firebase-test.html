<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Write Test</title>
</head>

<body>

    <h2>تست ثبت Firebase</h2>

    <div id="result">
        در حال تست ثبت...
    </div>

    <script type="module">

        import {
            initializeApp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


        const firebaseConfig = {

            apiKey:
                "AIzaSyCeDSU7d3JyNgny0MWjEpYYY4QrMTMDngs",

            authDomain:
                "salon-mojezeh.firebaseapp.com",

            projectId:
                "salon-mojezeh",

            storageBucket:
                "salon-mojezeh.firebasestorage.app",

            messagingSenderId:
                "1023073696440",

            appId:
                "1:1023073696440:web:98f95b75e36408d990124d"

        };


        const result =
            document.getElementById("result");


        try {

            const app =
                initializeApp(firebaseConfig);

            const db =
                getFirestore(app);


            const testDocument =
                doc(
                    db,
                    "firebase_test",
                    "browser_test"
                );


            await setDoc(
                testDocument,
                {

                    test: true,

                    message:
                        "Firebase write test",

                    createdAt:
                        serverTimestamp()

                }
            );


            result.innerHTML = `

                <h3 style="color:green">
                    ✅ ثبت در Firebase موفق است
                </h3>

                <p>
                    عملیات نوشتن Firestore بدون مشکل انجام شد.
                </p>

            `;

        }

        catch (error) {

            console.error(error);


            result.innerHTML = `

                <h3 style="color:red">
                    ❌ ثبت در Firebase ناموفق است
                </h3>

                <p>
                    <strong>Code:</strong>
                    ${error.code || "unknown"}
                </p>

                <p>
                    <strong>Message:</strong>
                    ${error.message || "unknown"}
                </p>

            `;

        }

    </script>

</body>
</html>
