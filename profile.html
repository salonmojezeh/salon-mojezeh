<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پروفایل | سالن معجزه</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="profile.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></head><body>
<div id="loader"><div class="loader-circle"></div><h2>سالن معجزه</h2></div><div id="overlay"></div><aside id="sidebar"><div class="sidebar-header"><img src="images/logo.png" alt="سالن معجزه"><h2>سالن معجزه</h2><button id="closeSidebar" type="button"><i class="fa-solid fa-xmark"></i></button></div><nav><a href="index.html"><i class="fa-solid fa-house"></i><span>صفحه اصلی</span></a><a href="reserve.html"><i class="fa-solid fa-calendar-days"></i><span>رزرو نوبت</span></a><a href="club.html"><i class="fa-solid fa-gift"></i><span>باشگاه مشتریان</span></a><a href="profile.html"><i class="fa-solid fa-user"></i><span>پروفایل من</span></a><a href="admin.html"><i class="fa-solid fa-gauge"></i><span>پنل مدیریت</span></a></nav></aside>
<header id="header"><button id="menuBtn" type="button"><i class="fa-solid fa-bars"></i></button><a class="logo-box" href="index.html"><img src="images/logo.png" alt="Salon"><div><h2>سالن معجزه</h2><small>پروفایل و رزروهای شما</small></div></a><button id="themeToggle" type="button"><i class="fa-solid fa-moon"></i></button></header>
<main class="profile-page"><section class="profile-welcome"><div><h1 id="welcomeTitle">پروفایل من</h1><p id="accountMeta">در حال دریافت اطلاعات حساب...</p></div><button id="logoutBtn" class="secondary-btn"><i class="fa-solid fa-right-from-bracket"></i> خروج</button></section><p id="profileMessage" class="profile-message" aria-live="polite"></p>
<section id="statsGrid" class="stats-grid"></section><section class="profile-panel"><div class="panel-heading"><h2>رزروهای من / رزروهای سالن</h2><button id="refreshBtn" class="secondary-btn"><i class="fa-solid fa-rotate"></i> تازه‌سازی</button></div><div id="reservationsList" class="reservations-list"></div></section>
<section id="blocksPanel" class="profile-panel" hidden><div class="panel-heading"><h2>مدیریت تعطیلی و ساعت‌های بسته</h2><span>آرایشگر و مدیر می‌توانند زمان‌های غیرقابل رزرو را ثبت کنند.</span></div>
<form id="blockForm" class="block-form"><label>تاریخ<input id="blockDate" type="date" required></label><label id="blockBarberLabel">آرایشگر<select id="blockBarber"><option value="">کل سالن</option></select></label><label>نوع بازه<select id="blockType"><option value="closed">بسته / خارج از ساعت کاری</option><option value="busy">مشغول</option><option value="holiday">تعطیلی</option><option value="leave">مرخصی</option></select></label><label>از ساعت (اختیاری)<input id="blockStart" type="time"></label><label>تا ساعت (اختیاری)<input id="blockEnd" type="time"></label><label>عنوان<input id="blockTitle" maxlength="100" placeholder="مثلاً جلسه یا مرخصی"></label><label class="block-wide">توضیحات<input id="blockReason" maxlength="250" placeholder="توضیحات اختیاری"></label><button class="primary-btn" type="submit"><i class="fa-solid fa-plus"></i> ثبت بازه بسته</button></form><div id="blocksList" class="blocks-list"></div></section></main>
<script src="script.js"></script><script type="module" src="profile.js"></script></body></html>
