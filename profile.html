<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پروفایل | سالن معجزه</title>
<link rel="stylesheet" href="profile.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">✂️ سالن معجزه</a>
  <div class="actions">
    <button id="btnTheme" class="iconbtn" title="تغییر تم">🌙</button>
    <a class="btn small" href="reserve.html">رزرو نوبت</a>
    <a id="btnAdmin" class="btn small hidden" href="admin.html">پنل مدیریت</a>
    <button id="btnLogout" class="btn small danger">خروج</button>
  </div>
</header>

<main class="wrap">
  <div id="who" class="card"><p class="empty">در حال بارگذاری…</p></div>

  <!-- بخش مشتری -->
  <section id="custSec" class="hidden">
    <div class="card">
      <h3>🎁 باشگاه مشتریان</h3>
      <div id="clubBox"></div>
    </div>
    <div class="card">
      <h3>📅 رزروهای من</h3>
      <div id="myRes"></div>
    </div>
  </section>

  <!-- بخش آرایشگر -->
  <section id="barberSec" class="hidden">
    <div class="card">
      <h3>📅 رزروهای من (آرایشگر)</h3>
      <div class="toolbar"><input id="brDate" type="date" class="input"><button id="btnBrLoad" class="btn small main">نمایش</button></div>
      <div id="barberRes"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="profile.js"></script>
</body>
</html>
