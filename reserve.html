<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رزرو نوبت | سالن معجزه</title>
<link rel="stylesheet" href="booking.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">✂️ سالن معجزه</a>
  <div class="actions">
    <button id="btnTheme" class="iconbtn" title="تغییر تم">🌙</button>
    <a id="btnAccount" class="btn small" href="login.html">ورود</a>
  </div>
</header>

<main class="wrap">
  <div class="steps">
    <span class="step active" data-step="1">۱. خدمت</span>
    <span class="step" data-step="2">۲. آرایشگر</span>
    <span class="step" data-step="3">۳. تاریخ</span>
    <span class="step" data-step="4">۴. ساعت</span>
    <span class="step" data-step="5">۵. تأیید</span>
  </div>

  <!-- گام ۱: خدمت -->
  <section class="panel active" id="step1">
    <h2>خدمت موردنظر را انتخاب کنید</h2>
    <div id="svcGrid" class="grid"></div>
  </section>

  <!-- گام ۲: آرایشگر -->
  <section class="panel" id="step2">
    <h2>آرایشگر خود را انتخاب کنید</h2>
    <div id="barberGrid" class="grid"></div>
    <div class="navrow">
      <button class="btn" data-go="1">بازگشت</button>
    </div>
  </section>

  <!-- گام ۳: تاریخ -->
  <section class="panel" id="step3">
    <h2>تاریخ را انتخاب کنید</h2>
    <input id="resDate" type="date" class="input center">
    <p class="hint">تا ۳۰ روز آینده قابل رزرو است.</p>
    <div class="navrow">
      <button class="btn" data-go="2">بازگشت</button>
      <button class="btn main" id="btnToDate">ادامه</button>
    </div>
  </section>

  <!-- گام ۴: ساعت -->
  <section class="panel" id="step4">
    <h2>ساعت را انتخاب کنید</h2>
    <div id="timesBox" class="times"><p class="empty">در حال بارگذاری…</p></div>
    <div class="navrow">
      <button class="btn" data-go="3">بازگشت</button>
    </div>
  </section>

  <!-- گام ۵: تأیید -->
  <section class="panel" id="step5">
    <h2>بازبینی و تأیید نهایی</h2>
    <div id="summary" class="summary"></div>
    <form id="formConfirm">
      <label>نام و نام خانوادگی
        <input id="fName" class="input" required autocomplete="name">
      </label>
      <label>شماره موبایل
        <input id="fPhone" class="input" inputmode="tel" placeholder="۰۹xxxxxxxxx" required autocomplete="tel">
      </label>
      <label>یادداشت (اختیاری)
        <textarea id="fNotes" class="input" rows="2"></textarea>
      </label>
      <p id="msg" class="msg hidden"></p>
      <div class="navrow">
        <button type="button" class="btn" data-go="4">بازگشت</button>
        <button class="btn main" type="submit" id="btnSubmit">ثبت نهایی رزرو</button>
      </div>
    </form>
  </section>
</main>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="reserve-script.js"></script>
</body>
</html>
