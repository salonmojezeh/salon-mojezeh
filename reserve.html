<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>رزرو نوبت | سالن معجزه</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>رزرو نوبت سالن معجزه</h1>

<p>
نوبت خود را آنلاین رزرو کنید
</p>

</header>



<section class="reserve-box">


<h2>انتخاب خدمت</h2>


<select id="service">

<option value="">
انتخاب کنید
</option>


<option value="اصلاح مو">
اصلاح مو
</option>


<option value="فید حرفه‌ای">
فید حرفه‌ای
</option>


<option value="گریم داماد">
گریم داماد
</option>


<option value="پاکسازی پوست">
پاکسازی پوست
</option>


<option value="خدمات دیگر">
خدمات دیگر
</option>


</select>



<h2>
انتخاب تاریخ
</h2>


<input 
type="date"
id="date">



<h2>
انتخاب ساعت
</h2>


<div id="times">


<button class="time">
09:00
</button>


<button class="time">
10:00
</button>


<button class="time">
11:00
</button>


<button class="time">
12:00
</button>


<button class="time">
13:00
</button>


<button class="time">
14:00
</button>


<button class="time">
15:00
</button>


<button class="time">
16:00
</button>


<button class="time">
17:00
</button>


<button class="time">
18:00
</button>


<button class="time">
19:00
</button>


<button class="time">
20:00
</button>


<button class="time">
21:00
</button>


</div>




<h2>
اطلاعات مشتری
</h2>


<input
id="name"
type="text"
placeholder="نام و نام خانوادگی">



<input
id="phone"
type="tel"
placeholder="شماره موبایل">



<button 
class="reserve-btn"
onclick="reserve()">

ثبت رزرو

</button>



</section>




<footer>

<p>
سالن معجزه - مشهد
</p>

</footer>



<script src="script.js"></script>


</body>


</html>
